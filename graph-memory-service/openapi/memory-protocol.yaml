openapi: 3.1.0
info:
  title: River2 Graph Memory Protocol
  version: 1.0.0-tracer
  description: Authoritative HTTP/JSON contract for the first greenfield tracer bullet.
servers:
  - url: http://localhost
security:
  - bearerAuth: []
paths:
  /v1/tenant:
    put:
      operationId: initializeTenant
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InitializeTenantRequest'}
      responses:
        '200': {$ref: '#/components/responses/InitializeTenantOK'}
        '201': {$ref: '#/components/responses/InitializeTenantCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/principals:
    post:
      operationId: registerPrincipal
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterPrincipalRequest'}
      responses:
        '200': {$ref: '#/components/responses/RegisterPrincipalOK'}
        '201': {$ref: '#/components/responses/RegisterPrincipalCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/spaces:
    post:
      operationId: registerSpace
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterSpaceRequest'}
      responses:
        '200': {$ref: '#/components/responses/RegisterSpaceOK'}
        '201': {$ref: '#/components/responses/RegisterSpaceCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/grants:
    post:
      operationId: registerGrant
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterGrantRequest'}
      responses:
        '200': {$ref: '#/components/responses/RegisterGrantOK'}
        '201': {$ref: '#/components/responses/RegisterGrantCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/evidence-batches:stage:
    post:
      operationId: stageEvidenceBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StageEvidenceBatchRequest'}
      responses:
        '200': {$ref: '#/components/responses/StageEvidenceBatchOK'}
        '201': {$ref: '#/components/responses/StageEvidenceBatchCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/evidence-batches/{batch_id}:commit:
    parameters:
      - {$ref: '#/components/parameters/BatchID'}
    post:
      operationId: commitEvidenceBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CommitEvidenceBatchRequest'}
      responses:
        '200': {$ref: '#/components/responses/CommitEvidenceBatchOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/evidence-batches/{batch_id}:
    parameters:
      - {$ref: '#/components/parameters/BatchID'}
    get:
      operationId: getEvidenceBatch
      responses:
        '200': {$ref: '#/components/responses/EvidenceBatchStatusOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/recalls:
    post:
      operationId: recall
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecallRequest'}
      responses:
        '200': {$ref: '#/components/responses/RecallOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/explorations:
    post:
      operationId: startExploration
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StartExplorationRequest'}
      responses:
        '200': {$ref: '#/components/responses/StartExplorationOK'}
        '201': {$ref: '#/components/responses/StartExplorationCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/explorations/{session_id}:explore:
    parameters:
      - {$ref: '#/components/parameters/SessionID'}
    post:
      operationId: explore
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExploreRequest'}
      responses:
        '200': {$ref: '#/components/responses/ExploreOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/BudgetExhausted'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/explorations/{session_id}:redirect:
    parameters:
      - {$ref: '#/components/parameters/SessionID'}
    post:
      operationId: redirectExploration
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RedirectRequest'}
      responses:
        '200': {$ref: '#/components/responses/RedirectOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/BudgetExhausted'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/explorations/{session_id}:submit:
    parameters:
      - {$ref: '#/components/parameters/SessionID'}
    post:
      operationId: submitExploration
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmitRequest'}
      responses:
        '200': {$ref: '#/components/responses/SubmitOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/BudgetExhausted'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/explorations/{session_id}:navigate:
    parameters:
      - {$ref: '#/components/parameters/SessionID'}
    post:
      operationId: navigateExploration
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NavigateRequest'}
      responses:
        '200': {$ref: '#/components/responses/NavigateOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/BudgetExhausted'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/explorations/{session_id}/dive:
    parameters:
      - {$ref: '#/components/parameters/SessionID'}
    get:
      operationId: readExplorationDive
      parameters:
        - name: request_id
          in: query
          required: true
          schema: {$ref: '#/components/schemas/OpaqueID'}
      responses:
        '200': {$ref: '#/components/responses/DiveReadOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/patterns/{pattern_id}:
    parameters:
      - {$ref: '#/components/parameters/PatternID'}
    get:
      operationId: readPattern
      parameters:
        - name: space_id
          in: query
          required: true
          schema: {$ref: '#/components/schemas/OpaqueID'}
        - name: request_id
          in: query
          required: true
          schema: {$ref: '#/components/schemas/OpaqueID'}
      responses:
        '200': {$ref: '#/components/responses/PatternReadOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/patterns/{pattern_id}:reject:
    parameters:
      - {$ref: '#/components/parameters/PatternID'}
    post:
      operationId: rejectPattern
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RejectPatternRequest'}
      responses:
        '200': {$ref: '#/components/responses/PatternRejectOK'}
        '201': {$ref: '#/components/responses/PatternRejectCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/proposals/{proposal_id}:
    parameters:
      - {$ref: '#/components/parameters/ProposalID'}
    get:
      operationId: readProposal
      parameters:
        - name: space_id
          in: query
          required: true
          schema: {$ref: '#/components/schemas/OpaqueID'}
        - name: request_id
          in: query
          required: true
          schema: {$ref: '#/components/schemas/OpaqueID'}
      responses:
        '200': {$ref: '#/components/responses/ProposalReadOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/candidates/{candidate_id}:
    parameters:
      - {$ref: '#/components/parameters/CandidateID'}
    get:
      operationId: readCandidate
      parameters:
        - name: space_id
          in: query
          required: true
          schema: {$ref: '#/components/schemas/OpaqueID'}
        - name: request_id
          in: query
          required: true
          schema: {$ref: '#/components/schemas/OpaqueID'}
      responses:
        '200': {$ref: '#/components/responses/CandidateReadOK'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/candidates/{candidate_id}:decide:
    parameters:
      - {$ref: '#/components/parameters/CandidateID'}
    post:
      operationId: decideCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecideCandidateRequest'}
      responses:
        '200': {$ref: '#/components/responses/CandidateDecideOK'}
        '201': {$ref: '#/components/responses/CandidateDecideCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/candidates/{candidate_id}:activate:
    parameters:
      - {$ref: '#/components/parameters/CandidateID'}
    post:
      operationId: activateCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivateCandidateRequest'}
      responses:
        '200': {$ref: '#/components/responses/CandidateActivateOK'}
        '201': {$ref: '#/components/responses/CandidateActivateCreated'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    BatchID:
      name: batch_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/OpaqueID'}
    SessionID:
      name: session_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/OpaqueID'}
    PatternID:
      name: pattern_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/OpaqueID'}
    ProposalID:
      name: proposal_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/OpaqueID'}
    CandidateID:
      name: candidate_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/OpaqueID'}
  schemas:
    OpaqueID:
      type: string
      minLength: 1
      maxLength: 128
    InitializeTenantRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, display_name, bootstrap_principal_id]
      properties:
        tenant_id: {$ref: '#/components/schemas/OpaqueID'}
        display_name: {type: string, minLength: 1, maxLength: 200}
        bootstrap_principal_id: {$ref: '#/components/schemas/OpaqueID'}
    InitializeTenantResponse:
      type: object
      additionalProperties: false
      required: [tenant_id, bootstrap_principal_id, duplicate]
      properties:
        tenant_id: {$ref: '#/components/schemas/OpaqueID'}
        bootstrap_principal_id: {$ref: '#/components/schemas/OpaqueID'}
        duplicate: {type: boolean}
    RegisterPrincipalRequest:
      type: object
      additionalProperties: false
      required: [principal_id, kind, display_name]
      properties:
        principal_id: {$ref: '#/components/schemas/OpaqueID'}
        kind: {type: string, enum: [human, agent, service]}
        display_name: {type: string, minLength: 1, maxLength: 200}
    RegisterPrincipalResponse:
      type: object
      additionalProperties: false
      required: [principal_id, kind, duplicate]
      properties:
        principal_id: {$ref: '#/components/schemas/OpaqueID'}
        kind: {type: string, enum: [human, agent, service]}
        duplicate: {type: boolean}
    RegisterSpaceRequest:
      type: object
      additionalProperties: false
      required: [space_id, scope, owner_principal_id, display_name]
      properties:
        space_id: {$ref: '#/components/schemas/OpaqueID'}
        scope: {type: string, enum: [shared, private]}
        owner_principal_id:
          oneOf:
            - {$ref: '#/components/schemas/OpaqueID'}
            - {type: 'null'}
        display_name: {type: string, minLength: 1, maxLength: 200}
    RegisterSpaceResponse:
      type: object
      additionalProperties: false
      required: [space_id, scope, owner_principal_id, duplicate]
      properties:
        space_id: {$ref: '#/components/schemas/OpaqueID'}
        scope: {type: string, enum: [shared, private]}
        owner_principal_id:
          oneOf:
            - {$ref: '#/components/schemas/OpaqueID'}
            - {type: 'null'}
        duplicate: {type: boolean}
    GrantOperation:
      type: string
      enum: [evidence.stage, evidence.commit, recall, exploration.start, exploration.explore, exploration.redirect, exploration.submit, causal.trial.append, causal.estimate.append, causal.reward.append, causal.read, dive.read, pattern.read, pattern.reject, proposal.read, candidate.read, candidate.decide, candidate.activate]
    RegisterGrantRequest:
      type: object
      additionalProperties: false
      required: [grant_id, principal_id, space_ids, purpose, operations, expires_at]
      properties:
        grant_id: {$ref: '#/components/schemas/OpaqueID'}
        principal_id: {$ref: '#/components/schemas/OpaqueID'}
        space_ids: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/OpaqueID'}}
        purpose: {type: string, enum: [lifecycle, tool_plane, curation]}
        operations: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/GrantOperation'}}
        expires_at: {type: string, format: date-time}
    RegisterGrantResponse:
      type: object
      additionalProperties: false
      required: [grant_id, principal_id, space_ids, purpose, operations, expires_at, duplicate]
      properties:
        grant_id: {$ref: '#/components/schemas/OpaqueID'}
        principal_id: {$ref: '#/components/schemas/OpaqueID'}
        space_ids: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/OpaqueID'}}
        purpose: {type: string, enum: [lifecycle, tool_plane, curation]}
        operations: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/GrantOperation'}}
        expires_at: {type: string, format: date-time}
        duplicate: {type: boolean}
    Provenance:
      type: object
      additionalProperties: false
      required: [host_type, host_instance_id, source_kind, captured_at, content_sha256]
      properties:
        host_type: {type: string, const: pi-group-chat-host}
        host_instance_id: {$ref: '#/components/schemas/OpaqueID'}
        source_kind: {type: string, enum: [room_shared, agent_private]}
        captured_at: {type: string, format: date-time}
        content_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    EvidenceEvent:
      type: object
      additionalProperties: false
      required: [event_id, sequence, kind, content, occurred_at]
      properties:
        event_id: {$ref: '#/components/schemas/OpaqueID'}
        sequence: {type: integer, format: int64, minimum: 1}
        kind: {type: string, enum: [room_message, room_tool_call, room_tool_result, pi_internal, segment_terminal]}
        content: {type: string}
        occurred_at: {type: string, format: date-time}
    EvidenceLink:
      type: object
      additionalProperties: false
      required: [link_id, from_event_id, to_event_id, relation]
      properties:
        link_id: {$ref: '#/components/schemas/OpaqueID'}
        from_event_id: {$ref: '#/components/schemas/OpaqueID'}
        to_event_id: {$ref: '#/components/schemas/OpaqueID'}
        relation: {type: string, enum: [mentions, responds_to, continues, delegates_to]}
    StageEvidenceBatchRequest:
      type: object
      additionalProperties: false
      required: [batch_id, idempotency_key, space_id, stream_id, source_segment_id, provenance, events, links, terminal_outcome]
      properties:
        batch_id: {$ref: '#/components/schemas/OpaqueID'}
        idempotency_key: {$ref: '#/components/schemas/OpaqueID'}
        space_id: {$ref: '#/components/schemas/OpaqueID'}
        stream_id: {$ref: '#/components/schemas/OpaqueID'}
        source_segment_id: {$ref: '#/components/schemas/OpaqueID'}
        provenance: {$ref: '#/components/schemas/Provenance'}
        events: {type: array, minItems: 1, items: {$ref: '#/components/schemas/EvidenceEvent'}}
        links: {type: array, items: {$ref: '#/components/schemas/EvidenceLink'}}
        terminal_outcome: {type: string, enum: [settled, failed, aborted]}
    StageEvidenceBatchResponse:
      type: object
      additionalProperties: false
      required: [batch_id, idempotency_key, space_id, state, duplicate]
      properties:
        batch_id: {$ref: '#/components/schemas/OpaqueID'}
        idempotency_key: {$ref: '#/components/schemas/OpaqueID'}
        space_id: {$ref: '#/components/schemas/OpaqueID'}
        state: {type: string, enum: [staged, committed]}
        duplicate: {type: boolean}
    CommitEvidenceBatchRequest:
      type: object
      additionalProperties: false
      required: [commit_id]
      properties:
        commit_id: {$ref: '#/components/schemas/OpaqueID'}
    CommitEvidenceBatchResponse:
      type: object
      additionalProperties: false
      required: [batch_id, commit_id, state, memory_version, committed_at, duplicate]
      properties:
        batch_id: {$ref: '#/components/schemas/OpaqueID'}
        commit_id: {$ref: '#/components/schemas/OpaqueID'}
        state: {type: string, const: committed}
        memory_version: {type: integer, format: int64, minimum: 1}
        committed_at: {type: string, format: date-time}
        duplicate: {type: boolean}
    EvidenceBatchStatusResponse:
      type: object
      additionalProperties: false
      required: [batch_id, idempotency_key, space_id, source_segment_id, state, memory_version, committed_at]
      properties:
        batch_id: {$ref: '#/components/schemas/OpaqueID'}
        idempotency_key: {$ref: '#/components/schemas/OpaqueID'}
        space_id: {$ref: '#/components/schemas/OpaqueID'}
        source_segment_id: {$ref: '#/components/schemas/OpaqueID'}
        state: {type: string, enum: [staged, committed]}
